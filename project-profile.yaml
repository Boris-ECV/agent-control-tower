# ============================================================
# PROJECT PROFILE - the ONLY place project-specific facts live.
# Agents read this before running any build/test/lint command. (docs/04)
# ============================================================

project:
  name: "Agent Control Tower"
  jira_key: "SDLCCT"
  repo: "github.com/Boris-ECV/agent-control-tower"
  default_branch: main
  description: >
    A control tower for AI agents: reads agent telemetry (traces, spans,
    token usage, cost) from an LLM-observability backend through its REST API
    and presents cost, quality and governance views to business and
    operations managers. Current scope is a customer demo built around a
    cost-runaway story for a manufacturing company; the demo data is fully
    synthetic and generated by seed/.

stack:
  language: "python 3.12 (seed/, data generator); portal and API layer language TBD by the architect at G1b"
  frameworks: []                       # TODO: set when the first Portal story is designed (G1b)
  database: "none yet (agent registry / budgets will be added by an E2 story)"
  notes: >
    Greenfield repo seeded from an existing, already-working data generator
    (seed/). The observability backend is an external service reached over
    HTTPS; its base URL is supplied through the OPIK_BASE_URL environment
    variable and is never committed. All cost queries MUST pass explicit
    project ids (see CONSTITUTION.md). Dates and daily buckets are UTC.

commands:
  setup: "cd seed && uv sync"
  build: ""
  test: "cd seed && uv run pytest -q"
  lint: "cd seed && uv run ruff check ."
  coverage: "cd seed && uv run pytest --cov --cov-report=term-missing -q"
  e2e: ""                              # TODO: set when the first UI story adds Playwright

quality:
  coverage_threshold: 60               # starting value; measured over seed/catalog.py and seed/generate.py only (see seed/pyproject.toml). Raise after the first stories land.
  lint_zero_tolerance: true

conventions:
  code_style: "ruff (config in seed/pyproject.toml)"
  commit_format: "<type>(<JIRA-KEY>): <summary>"
  branch_format: "story/<JIRA-KEY>-<slug>"
  test_layout: "seed/tests/ for the data generator; portal/API tests layout decided at G1b"
  notes: >
    Network-dependent checks (seed/verify.py, seed/preflight.py) talk to a
    live backend and are NOT run in CI; any test that needs the backend must
    be skipped unless OPIK_BASE_URL is set. If a story adds UI, the e2e tool
    and conventions are decided in its design doc and recorded here
    (screenshots as a CI artifact are recommended).

structure:
  seed: "seed/ (python; synthetic data generator, reconciliation checks)"
  portal: "TODO (decided at G1b of the first Portal story)"
  tests: "seed/tests/"
  docs: "docs/ (framework docs 00-08, design-system.md skeleton, PRD.md and design/ added by agents)"

deployment:
  environments: []
  notes: "Manual deployment to a single host in v1 (human-run; stories touching it carry the label needs-human-gate). The deployment module is not enabled."

