# Quality gate for the data generator (seed/). Every step that depends on files
# that do not exist yet is skipped, so a fresh repository starts green. The
# portal job is added by the first Portal story.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seed
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Syntax check
        run: uv run python -m compileall -q .

      - name: Test + coverage gate
        if: hashFiles('seed/tests/**/*.py') != ''
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=60 -q
